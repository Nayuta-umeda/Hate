<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ロビー</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <div>
        <h1>ロビー</h1>
        <div class="sub">密告掲示板</div>
      </div>
      <div class="actions">
        <button id="mikokuBtn" type="button">密告</button>
        <button id="refreshBtn" class="secondary" type="button">更新</button>
      </div>
    </header>

    <section class="panel" id="boardWrap" aria-label="掲示板">
      <div id="boardHead">
        <div id="status" aria-live="polite"></div>
        <div class="actions">
          <button id="closeComposeBtn" class="secondary" type="button" style="display:none;">閉じる</button>
        </div>
      </div>

      <div id="posts"></div>

      <div id="compose">
        <div id="composeInner">
          <div class="grid">
            <label>
              名前
              <input id="name" autocomplete="nickname" placeholder="名無しさん" maxlength="24" />
            </label>
            <label>
              メール
              <input id="mail" autocomplete="email" placeholder="（任意）" maxlength="40" />
            </label>
          </div>

          <label style="margin-top:8px;">
            本文
            <textarea id="body" placeholder="個人情報・誹謗中傷は書かない。短く、事実だけ。" maxlength="800"></textarea>
          </label>

          <div class="composeActions">
            <button id="sendBtn" type="button">書き込む</button>
            <button id="cancelBtn" class="secondary" type="button">キャンセル</button>
          </div>
        </div>
        <div class="note">※個人情報・誹謗中傷は禁止。</div>
      </div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
