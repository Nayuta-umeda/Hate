<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NOCT LOG</title>
  <style>
    :root{
      color-scheme: dark;
      --bg:#07080b;
      --bg2:#0b0d12;
      --panel:#101321;
      --panel2:#0c0f1b;
      --text:#eef0f6;
      --muted:rgba(238,240,246,.72);
      --faint:rgba(238,240,246,.46);
      --line:rgba(255,255,255,.12);
      --accent:#8aa7ff;
      --good:#3bd671;
      --warn:#ffd36a;
      --bad:#ff5a6a;
      --shadow: 0 12px 34px rgba(0,0,0,.48);
      --r:18px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html, body{ height:100%; }
    body{
      margin:0;
      font-family: var(--sans);
      background:
        radial-gradient(1200px 800px at 10% -20%, rgba(138,167,255,.18), transparent 55%),
        radial-gradient(900px 700px at 110% 0%, rgba(255,90,106,.10), transparent 60%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--text);
      overflow-x:hidden;
    }
    body::before{
      content:"";
      position: fixed;
      inset:0;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.03),
          rgba(255,255,255,.03) 1px,
          transparent 1px,
          transparent 4px
        );
      pointer-events:none;
      opacity:.22;
      mix-blend-mode: overlay;
    }

    .wrap{
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding: 16px 12px 26px;
    }
    .app{
      width: 100%;
      max-width: 940px;
      display:flex;
      flex-direction:column;
      gap: 12px;
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(16,19,33,.92), rgba(12,15,27,.84));
      border-radius: var(--r);
      box-shadow: var(--shadow);
      position: sticky;
      top: 8px;
      z-index: 5;
      backdrop-filter: blur(10px);
    }

    .brand{ display:flex; flex-direction:column; gap: 8px; min-width:0; }
    .brandTitle{
      font-family: var(--mono);
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brandSub{ display:flex; gap: 10px; flex-wrap:wrap; align-items:center; color: var(--muted); font-size: 12px; }
    .pill{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(0,0,0,.18);
      font-family: var(--mono);
    }
    .dot{ width:10px; height:10px; border-radius:999px; background: var(--warn); box-shadow: 0 0 14px rgba(255,211,106,.42); }
    .dot.ok{ background: var(--good); box-shadow: 0 0 14px rgba(59,214,113,.40); }

    .nav{ display:flex; gap: 10px; flex-wrap:wrap; justify-content:flex-end; }

    .btn{
      appearance:none;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.05);
      color: var(--text);
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 800;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap: 10px;
      transition: transform .05s ease, background .15s ease, border-color .15s ease;
      user-select:none;
      white-space: nowrap;
    }
    .btn:active{ transform: translateY(1px); }
    .btn:hover{ background: rgba(255,255,255,.07); }
    .btn.primary{ border-color: rgba(138,167,255,.45); background: rgba(138,167,255,.14); }
    .btn.danger{ border-color: rgba(255,90,106,.45); background: rgba(255,90,106,.12); }
    .btn.ghost{ background: transparent; }
    .btn.small{ padding: 10px 12px; border-radius: 14px; font-size: 16px; font-weight: 800; }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }

    main{ display:grid; grid-template-columns: 1fr; gap: 12px; }
    @media(min-width: 920px){ main{ grid-template-columns: 1.25fr .75fr; } }

    .card{
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(16,19,33,.86), rgba(12,15,27,.78));
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .title{ font-size: 20px; font-weight: 900; margin: 0 0 10px; letter-spacing: .04em; }
    .muted{ color: var(--muted); }
    .faint{ color: var(--faint); }
    .hr{ height:1px; background: var(--line); margin: 12px 0; }

    label{ display:block; font-size: 14px; color: var(--muted); margin: 12px 0 8px; font-weight: 800; }
    input[type="text"], input[type="password"], textarea, select{
      width:100%;
      border:1px solid var(--line);
      background: rgba(0,0,0,.22);
      color: var(--text);
      padding: 14px;
      border-radius: 16px;
      outline:none;
      font-size: 18px;
      font-weight: 750;
    }
    textarea{ min-height: 150px; resize: vertical; line-height:1.55; }
    select{ padding-right: 12px; }

    .notice{
      border: 1px solid rgba(255,211,106,.42);
      background: rgba(255,211,106,.08);
      border-radius: 16px;
      padding: 12px;
      color: rgba(255,240,200,.98);
      font-size: 14px;
      line-height: 1.5;
      font-weight: 900;
    }
    .notice.bad{ border-color: rgba(255,90,106,.48); background: rgba(255,90,106,.08); color: rgba(255,205,215,.98); }

    .grid2{ display:grid; grid-template-columns:1fr; gap: 10px; }
    @media(min-width: 640px){ .grid2{ grid-template-columns:1fr 1fr; } }

    .list{ display:flex; flex-direction:column; gap: 10px; }

    .post{
      border:1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      background: rgba(0,0,0,.18);
    }
    .postTop{ display:flex; justify-content:space-between; gap: 10px; align-items:flex-start; }
    .postTitle{ font-weight: 900; font-size: 16px; margin: 0; }
    .tags{ display:flex; flex-wrap:wrap; gap: 6px; margin-top: 8px; }
    .tag{
      font-family: var(--mono);
      font-size: 12px;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.03);
      color: var(--muted);
    }
    .badge{
      font-family: var(--mono);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.20);
      color: var(--muted);
      white-space: nowrap;
    }
    .badge.approved{ border-color: rgba(59,214,113,.40); color: rgba(200,255,225,.98); background: rgba(59,214,113,.08); }
    .badge.pending{ border-color: rgba(255,211,106,.45); color: rgba(255,240,200,.98); background: rgba(255,211,106,.08); }
    .badge.rejected{ border-color: rgba(255,90,106,.45); color: rgba(255,205,215,.98); background: rgba(255,90,106,.08); }

    .postBody{ font-size: 16px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; margin-top: 8px; }
    .postMeta{ display:flex; flex-wrap:wrap; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--faint); font-family: var(--mono); }
    .actions{ display:flex; flex-wrap:wrap; gap: 10px; margin-top: 12px; }

    .modalBack{ position:fixed; inset:0; background: rgba(0,0,0,.58); display:none; align-items:center; justify-content:center; padding: 18px; z-index: 50; }
    .modalBack.show{ display:flex; }
    .modal{ width: 100%; max-width: 740px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(16,19,33,.96), rgba(12,15,27,.92)); border-radius: 18px; box-shadow: 0 18px 60px rgba(0,0,0,.55); padding: 14px; }
    .modal h3{ margin: 6px 0 10px; font-size: 18px; font-weight: 900; }
    .modal .modalBody{ font-size: 16px; line-height: 1.6; }
    .modal .modalActions{ display:flex; gap: 10px; justify-content:flex-end; margin-top: 12px; flex-wrap:wrap; }

    .fileList{ display:flex; flex-direction:column; gap: 8px; margin-top: 10px; }
    .fileChip{
      border:1px solid var(--line);
      background: rgba(0,0,0,.18);
      border-radius: 16px;
      padding: 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }
    .fileChip strong{ color: var(--text); font-weight: 900; }
    .fileChip .right{ display:flex; gap: 10px; flex-wrap:wrap; justify-content:flex-end; }

    .mono{ font-family: var(--mono); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="app">
      <header>
        <div class="brand">
          <div class="brandTitle">NOCT LOG</div>
          <div class="brandSub">
            <span class="pill"><span class="dot" id="connDot"></span><span id="connText">...</span></span>
            <span class="pill">base <span class="mono" id="baseUrlText"></span></span>
            <span class="pill">id <span class="mono" id="userIdText"></span></span>
          </div>
        </div>
        <div class="nav" id="nav"></div>
      </header>

      <main>
        <section class="card" id="main"></section>
        <aside class="card" id="side"></aside>
      </main>
    </div>
  </div>

  <div class="modalBack" id="modalBack" role="dialog" aria-modal="true">
    <div class="modal">
      <h3 id="modalTitle">確認</h3>
      <div class="modalBody" id="modalBody"></div>
      <div class="modalActions" id="modalActions"></div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  const BASE_URL = "https://anim5s-server.onrender.com";
  const API_PREFIX = "/api/noctlog";
  const NL = String.fromCharCode(10);

  const LS = {
    userId: "noct_user_id",
    myVotes: "noct_votes_v1",
    localStore: "noct_local_store_v1",
    adminSession: "noct_admin_session_v1",
  };

  const state = {
    route: "lobby",
    conn: { ok:false, lastErr:"" },
    userId: "",
    admin: { authed:false, name:"", token:"" },
    data: { approved:[], mine:[], pending:[], rejected:[], approvedAll:[] },
    ui: { busy:false }
  };

  const $ = (sel) => document.querySelector(sel);
  const el = (tag, attrs={}, ...children) => {
    const n = document.createElement(tag);
    for(const [k,v] of Object.entries(attrs)){
      if(k === "class") n.className = v;
      else if(k === "text") n.textContent = v;
      else if(k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
      else if(v !== null && v !== undefined) n.setAttribute(k, String(v));
    }
    for(const c of children){
      if(c === null || c === undefined) continue;
      if(typeof c === "string") n.appendChild(document.createTextNode(c));
      else n.appendChild(c);
    }
    return n;
  };

  const nowISO = () => new Date().toISOString();
  const fmtTime = (iso) => {
    try{
      const d = new Date(iso);
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const dd = String(d.getDate()).padStart(2,"0");
      const hh = String(d.getHours()).padStart(2,"0");
      const mm = String(d.getMinutes()).padStart(2,"0");
      return `${y}-${m}-${dd} ${hh}:${mm}`;
    }catch{ return iso; }
  };

  const uid = () => {
    const a = crypto.getRandomValues(new Uint8Array(10));
    return Array.from(a).map(x=>x.toString(16).padStart(2,"0")).join("");
  };

  function getUserId(){
    let id = localStorage.getItem(LS.userId);
    if(!id){ id = uid(); localStorage.setItem(LS.userId, id); }
    return id;
  }

  function loadJSON(key, fallback){
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch{ return fallback; }
  }
  function saveJSON(key, value){ localStorage.setItem(key, JSON.stringify(value)); }

  function routeTo(name){ location.hash = "#" + name; }
  function getRoute(){ const h = (location.hash||"#lobby").replace("#","").trim(); return h || "lobby"; }
  function setBusy(b){ state.ui.busy = b; render(); }

  function showModal({title, body, actions}){
    $("#modalTitle").textContent = title || "確認";
    const mb = $("#modalBody");
    mb.innerHTML = "";
    if(typeof body === "string") mb.textContent = body;
    else mb.appendChild(body);

    const ma = $("#modalActions");
    ma.innerHTML = "";
    for(const a of (actions||[])) ma.appendChild(a);
    $("#modalBack").classList.add("show");
  }
  function closeModal(){ $("#modalBack").classList.remove("show"); }
  $("#modalBack").addEventListener("click", (e)=>{ if(e.target === $("#modalBack")) closeModal(); });

  // connection/api
  $("#baseUrlText").textContent = BASE_URL;

  function withTimeout(promise, ms=8500){
    const c = new AbortController();
    const t = setTimeout(()=>c.abort("timeout"), ms);
    return Promise.race([ promise(c.signal).finally(()=>clearTimeout(t)) ]);
  }

  async function apiFetch(path, {method="GET", body=null, headers={}}={}){
    const url = BASE_URL + API_PREFIX + path;
    const res = await withTimeout((signal)=>fetch(url, {
      method,
      headers: { "Content-Type":"application/json", ...headers },
      body: body ? JSON.stringify(body) : null,
      signal,
      credentials: "omit",
    }));
    const text = await res.text();
    let json = null;
    try{ json = text ? JSON.parse(text) : null; }catch{ json = { raw:text }; }
    if(!res.ok){
      const msg = json?.error || json?.message || res.statusText || "request failed";
      const err = new Error(msg);
      err.status = res.status;
      err.payload = json;
      throw err;
    }
    return json;
  }

  async function pingServer(){
    try{
      await apiFetch("/ping", { method:"GET" });
      state.conn.ok = true;
      state.conn.lastErr = "";
    }catch(e){
      state.conn.ok = false;
      state.conn.lastErr = String(e?.message || e);
    }
    paintConn();
  }

  function paintConn(){
    const dot = $("#connDot");
    const txt = $("#connText");
    if(state.conn.ok){ dot.className = "dot ok"; txt.textContent = "connected"; }
    else{ dot.className = "dot"; txt.textContent = "local"; }
  }

  // local store
  function localStore(){ return loadJSON(LS.localStore, { posts: [] }); }
  function saveLocalStore(s){ saveJSON(LS.localStore, s); }
  function localUpsert(post){
    const s = localStore();
    const i = s.posts.findIndex(p=>p.id===post.id);
    if(i>=0) s.posts[i] = post; else s.posts.push(post);
    saveLocalStore(s);
  }
  function localList(filterFn){ return localStore().posts.filter(filterFn); }

  // model
  function makePost({title, body, tags, visibility, severity, attachments}){
    return {
      id: "P" + uid(),
      createdAt: nowISO(),
      updatedAt: nowISO(),
      reporterId: state.userId,
      title: title?.trim() || "(無題)",
      body: body?.trim() || "",
      tags: (tags||[]).map(t=>t.trim()).filter(Boolean).slice(0,12),
      visibility: visibility || "public",
      severity: severity || "medium",
      status: "pending",
      adminNote: "",
      votes: { priority:0, hold:0 },
      attachments: attachments || [],
    };
  }

  // PII check (minimal)
  function hasUrl(t){
    const s = String(t||"").toLowerCase();
    return s.includes("http://") || s.includes("https://");
  }
  function hasEmail(t){
    const s = String(t||"");
    const at = s.indexOf("@");
    if(at <= 0) return false;
    const dot = s.indexOf(".", at + 2);
    return dot > at + 1;
  }
  function hasPhone(t){
    const s = String(t||"");
    let run = "";
    for(const ch of s){
      if(ch >= "0" && ch <= "9"){
        run += ch;
        if(run.length > 12) run = run.slice(run.length - 12);
        if(run.length >= 10 && run[0] === "0") return true;
      }else{
        if(ch !== "-" && ch !== " " && ch !== "(" && ch !== ")") run = "";
      }
    }
    return false;
  }
  function detectPII(text){
    const hits = [];
    if(hasEmail(text)) hits.push("mail");
    if(hasPhone(text)) hits.push("phone");
    if(hasUrl(text)) hits.push("url");
    return hits;
  }

  // assumed server api
  async function submitPost(post){
    if(state.conn.ok){
      const r = await apiFetch("/posts", { method:"POST", body: { post } });
      return r?.post || post;
    }else{
      localUpsert(post);
      return post;
    }
  }

  async function listApproved(){
    if(state.conn.ok){
      const r = await apiFetch("/posts?status=approved&visibility=public", { method:"GET" });
      return r?.posts || [];
    }
    return localList(p=>p.status==="approved" && p.visibility==="public")
      .sort((a,b)=>(b.updatedAt||b.createdAt).localeCompare(a.updatedAt||a.createdAt));
  }

  async function listMine(){
    if(state.conn.ok){
      const r = await apiFetch(`/posts?reporterId=${encodeURIComponent(state.userId)}`, { method:"GET" });
      return r?.posts || [];
    }
    return localList(p=>p.reporterId===state.userId)
      .sort((a,b)=>(b.updatedAt||b.createdAt).localeCompare(a.updatedAt||a.createdAt));
  }

  async function vote(postId, kind){
    if(state.conn.ok){
      const r = await apiFetch("/vote", { method:"POST", body: { postId, kind, voterId: state.userId } });
      return r?.post;
    }
    const s = localStore();
    const p = s.posts.find(x=>x.id===postId);
    if(!p) throw new Error("post not found");
    if(kind === "priority") p.votes.priority++;
    if(kind === "hold") p.votes.hold++;
    p.updatedAt = nowISO();
    saveLocalStore(s);
    return p;
  }

  function adminHeaders(){ return state.admin.authed ? { "X-Admin-Token": state.admin.token } : {}; }

  async function adminLogin(password){
    if(state.conn.ok){
      const r = await apiFetch("/admin/login", { method:"POST", body: { password } });
      return r;
    }
    if(password === "noct-admin") return { ok:true, name:"LOCAL_ADMIN", token:"local" };
    throw new Error("invalid password");
  }

  async function adminList(status){
    if(state.conn.ok){
      const r = await apiFetch(`/admin/posts?status=${encodeURIComponent(status)}`, { method:"GET", headers: adminHeaders() });
      return r?.posts || [];
    }
    return localList(p=>p.status===status)
      .sort((a,b)=>(b.updatedAt||b.createdAt).localeCompare(a.updatedAt||a.createdAt));
  }

  async function adminModerate({postId, action, adminNote, tags}){
    if(state.conn.ok){
      const r = await apiFetch("/admin/moderate", { method:"POST", headers: adminHeaders(), body: { postId, action, adminNote, tags } });
      return r?.post;
    }
    const s = localStore();
    const p = s.posts.find(x=>x.id===postId);
    if(!p) throw new Error("post not found");
    if(action === "approve") p.status = "approved";
    if(action === "reject") p.status = "rejected";
    p.adminNote = (adminNote||"").slice(0,1000);
    if(Array.isArray(tags)) p.tags = tags.map(t=>String(t).trim()).filter(Boolean).slice(0,12);
    p.updatedAt = nowISO();
    saveLocalStore(s);
    return p;
  }

  function votesStore(){ return loadJSON(LS.myVotes, {}); }
  function setVoted(postId){ const s=votesStore(); s[postId]=true; saveJSON(LS.myVotes,s); }
  function hasVoted(postId){ return !!votesStore()[postId]; }

  function loadAdminSession(){
    const s = loadJSON(LS.adminSession, null);
    if(s?.authed) state.admin = { ...state.admin, ...s };
  }
  function saveAdminSession(){ saveJSON(LS.adminSession, state.admin); }

  function readAsDataURL(file){
    return new Promise((resolve, reject)=>{
      const fr = new FileReader();
      fr.onload = ()=>resolve(String(fr.result||""));
      fr.onerror = ()=>reject(fr.error || new Error("read failed"));
      fr.readAsDataURL(file);
    });
  }
  function downloadDataUrl(dataUrl, filename){
    const a = document.createElement("a");
    a.href = dataUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function previewMedia(f){
    let node = null;
    if(f.type?.startsWith("image/")){
      node = el("img", { src: f.dataUrl, style:"width:100%; border-radius:16px; border:1px solid rgba(255,255,255,.14);" });
    }else if(f.type?.startsWith("video/")){
      node = el("video", { src: f.dataUrl, controls:"controls", style:"width:100%; border-radius:16px; border:1px solid rgba(255,255,255,.14); background:#000;" });
    }else{
      node = el("div", { class:"muted" }, "N/A");
    }
    showModal({ title:"PREVIEW", body: node, actions:[ el("button", { class:"btn", onclick: closeModal }, "閉じる") ] });
  }

  function renderFileChip(f){
    const left = el("div", {},
      el("div", {}, el("strong", {}, f.name || "(file)")),
      el("div", { class:"faint" }, `${Math.round((f.size||0)/1024)} KB / ${f.type || "unknown"}`)
    );
    const right = el("div", { class:"right" });
    if((f.type?.startsWith("image/") || f.type?.startsWith("video/")) && f.dataUrl){
      right.appendChild(el("button", { class:"btn small", onclick:(e)=>{ e.stopPropagation(); previewMedia(f); } }, "見る"));
    }
    if(f.dataUrl){
      right.appendChild(el("button", { class:"btn small", onclick:(e)=>{ e.stopPropagation(); downloadDataUrl(f.dataUrl, f.name||"download"); } }, "DL"));
    }
    return el("div", { class:"fileChip" }, left, right);
  }

  async function refreshAll(){
    setBusy(true);
    try{
      await pingServer();
      const [approved, mine] = await Promise.all([ listApproved(), listMine() ]);
      state.data.approved = approved;
      state.data.mine = mine;
      if(state.admin.authed){
        const [pending, rejected, approvedAll] = await Promise.all([
          adminList("pending"),
          adminList("rejected"),
          adminList("approved"),
        ]);
        state.data.pending = pending;
        state.data.rejected = rejected;
        state.data.approvedAll = approvedAll;
      }
    }catch(e){
      state.conn.ok = false;
      state.conn.lastErr = String(e?.message||e);
      paintConn();
    }finally{
      setBusy(false);
    }
  }

  function renderNav(){
    const nav = $("#nav");
    nav.innerHTML = "";
    const mk = (label, hash, cls="btn") => el("button", { class: cls, onclick: ()=>routeTo(hash), disabled: state.ui.busy }, label);
    nav.appendChild(mk("ロビー", "lobby", "btn ghost"));
    nav.appendChild(mk("密告", "report", "btn primary"));
    nav.appendChild(mk("見る", "board", "btn"));
    nav.appendChild(mk("自分", "mine", "btn"));
    nav.appendChild(mk("管理", "admin", "btn"));
  }

  function renderSide(){
    const side = $("#side");
    side.innerHTML = "";
    side.appendChild(el("div", { class:"notice" }, "個人情報禁止（氏名/学校/住所/顔/連絡先）"));
    if(!state.conn.ok && state.conn.lastErr){
      side.appendChild(el("div", { class:"hr" }));
      side.appendChild(el("div", { class:"notice bad" }, "server error"));
      side.appendChild(el("div", { class:"muted", style:"font-size:12px; margin-top:8px; font-family:var(--mono);" }, state.conn.lastErr));
    }
    side.appendChild(el("div", { class:"hr" }));
    side.appendChild(el("div", { class:"muted", style:"font-size:12px; font-family:var(--mono);" }, "API ", API_PREFIX));
  }

  function renderMain(){
    const main = $("#main");
    main.innerHTML = "";
    const r = state.route;
    if(r === "lobby") main.appendChild(viewLobby());
    else if(r === "report") main.appendChild(viewReport());
    else if(r === "board") main.appendChild(viewBoard());
    else if(r === "mine") main.appendChild(viewMine());
    else if(r === "admin") main.appendChild(viewAdmin());
    else main.appendChild(viewNotFound());
  }

  function viewLobby(){
    const box = el("div", {});
    box.appendChild(el("div", { class:"title" }, "ロビー"));
    box.appendChild(el("div", { class:"actions" },
      el("button", { class:"btn primary", onclick: ()=>routeTo("report"), disabled: state.ui.busy }, "密告"),
      el("button", { class:"btn", onclick: ()=>routeTo("board"), disabled: state.ui.busy }, "見る"),
      el("button", { class:"btn", onclick: ()=>routeTo("mine"), disabled: state.ui.busy }, "自分"),
      el("button", { class:"btn", onclick: ()=>routeTo("admin"), disabled: state.ui.busy }, "管理"),
      el("button", { class:"btn", onclick: ()=>refreshAll(), disabled: state.ui.busy }, state.ui.busy ? "..." : "更新")
    ));
    return box;
  }

  function viewNotFound(){
    return el("div", {},
      el("div", { class:"title" }, "404"),
      el("div", { class:"actions" }, el("button", { class:"btn", onclick: ()=>routeTo("lobby") }, "ロビー"))
    );
  }

  function viewReport(){
    const box = el("div", {});
    box.appendChild(el("div", { class:"title" }, "密告"));

    const title = el("input", { type:"text", placeholder:"タイトル", maxlength:"80" });
    const body = el("textarea", { placeholder:"内容（事実ベース）" });
    const tagInput = el("input", { type:"text", placeholder:"タグ（カンマ）", maxlength:"120" });

    const severity = el("select", {},
      el("option", { value:"low" }, "低"),
      el("option", { value:"medium", selected:"selected" }, "中"),
      el("option", { value:"high" }, "高")
    );

    const visibility = el("select", {},
      el("option", { value:"public", selected:"selected" }, "周知OK"),
      el("option", { value:"private" }, "周知NG")
    );

    const agree = el("input", { type:"checkbox", id:"agree" });
    const agreeRow = el("label", { for:"agree", style:"display:flex; gap:10px; align-items:center; margin-top:12px;" },
      agree,
      el("span", { class:"muted" }, "個人情報を書かない")
    );

    const files = [];
    const fileInput = el("input", { type:"file", multiple:"multiple", accept:"image/*,video/*" });
    const fileList = el("div", { class:"fileList" });

    fileInput.addEventListener("change", async ()=>{
      fileList.innerHTML = "";
      files.length = 0;
      const arr = Array.from(fileInput.files || []);
      const maxFiles = 4;
      const maxMB = 18;
      for(const f of arr.slice(0, maxFiles)){
        if(f.size > maxMB*1024*1024){
          fileList.appendChild(el("div", { class:"notice bad" }, `${f.name} too big`));
          continue;
        }
        const dataUrl = await readAsDataURL(f);
        files.push({ id: "F"+uid(), name: f.name, type: f.type, size: f.size, dataUrl });
      }
      if(arr.length > maxFiles) fileList.appendChild(el("div", { class:"notice" }, `max ${maxFiles}`));
      for(const f of files) fileList.appendChild(renderFileChip(f));
    });

    const piiBox = el("div", { class:"notice bad", style:"display:none;" });
    function refreshPII(){
      const t = (title.value||"") + NL + (body.value||"") + NL + (tagInput.value||"");
      const hits = detectPII(t);
      if(hits.length){ piiBox.style.display = "block"; piiBox.textContent = "PII: " + hits.join(","); }
      else{ piiBox.style.display = "none"; piiBox.textContent = ""; }
      return hits;
    }
    title.addEventListener("input", refreshPII);
    body.addEventListener("input", refreshPII);
    tagInput.addEventListener("input", refreshPII);

    const sendBtn = el("button", { class:"btn primary" }, "送信");
    sendBtn.addEventListener("click", async ()=>{
      const hits = refreshPII();
      if(hits.length){
        showModal({ title:"NG", body:"個人情報の可能性", actions:[ el("button", { class:"btn", onclick: closeModal }, "戻る") ] });
        return;
      }
      if(!agree.checked){
        showModal({ title:"NG", body:"チェック必要", actions:[ el("button", { class:"btn", onclick: closeModal }, "OK") ] });
        return;
      }

      const tags = (tagInput.value||"").split(",").map(s=>s.trim()).filter(Boolean);
      const post = makePost({
        title: title.value,
        body: body.value,
        tags,
        visibility: visibility.value,
        severity: severity.value,
        attachments: files.slice(0,4),
      });

      showModal({
        title:"送信",
        body: el("div", {},
          el("div", { class:"muted" }, post.title),
          el("div", { class:"muted", style:"margin-top:8px;" }, `tags ${post.tags.join(", ") || "-"}`),
          el("div", { class:"muted", style:"margin-top:8px;" }, `添付 ${post.attachments.length}`)
        ),
        actions:[
          el("button", { class:"btn", onclick: closeModal }, "取消"),
          el("button", { class:"btn primary", onclick: async ()=>{
            closeModal();
            setBusy(true);
            try{
              await submitPost(post);
              await refreshAll();
              routeTo("mine");
            }catch(e){
              showModal({ title:"error", body: String(e?.message||e), actions:[ el("button", { class:"btn", onclick: closeModal }, "OK") ] });
            }finally{
              setBusy(false);
            }
          } }, "確定")
        ]
      });
    });

    box.appendChild(el("label", { text:"タイトル" }));
    box.appendChild(title);
    box.appendChild(el("label", { text:"内容" }));
    box.appendChild(body);

    box.appendChild(el("div", { class:"grid2" },
      el("div", {},
        el("label", { text:"タグ" }),
        tagInput
      ),
      el("div", {},
        el("label", { text:"緊急度" }),
        severity,
        el("label", { text:"周知" }),
        visibility
      )
    ));

    box.appendChild(el("label", { text:"添付" }));
    box.appendChild(fileInput);
    box.appendChild(fileList);

    box.appendChild(piiBox);
    box.appendChild(agreeRow);

    box.appendChild(el("div", { class:"actions" },
      sendBtn,
      el("button", { class:"btn", onclick: ()=>routeTo("mine"), disabled: state.ui.busy }, "自分")
    ));

    return box;
  }

  function viewBoard(){
    const box = el("div", {});
    box.appendChild(el("div", { class:"title" }, "見る"));

    const list = el("div", { class:"list" });
    const posts = (state.data.approved || []).slice();

    if(!posts.length){
      list.appendChild(el("div", { class:"notice" }, "なし"));
    }else{
      for(const p of posts){
        list.appendChild(renderPost(p, { mode:"public" }));
      }
    }

    box.appendChild(el("div", { class:"actions" },
      el("button", { class:"btn", onclick: ()=>refreshAll(), disabled: state.ui.busy }, state.ui.busy ? "..." : "更新")
    ));

    box.appendChild(list);
    return box;
  }

  function viewMine(){
    const box = el("div", {});
    box.appendChild(el("div", { class:"title" }, "自分"));

    const list = el("div", { class:"list" });
    const mine = (state.data.mine || []).slice();

    if(!mine.length){
      list.appendChild(el("div", { class:"notice" }, "なし"));
    }else{
      for(const p of mine){
        list.appendChild(renderPost(p, { mode:"mine" }));
      }
    }

    box.appendChild(el("div", { class:"actions" },
      el("button", { class:"btn primary", onclick: ()=>routeTo("report"), disabled: state.ui.busy }, "密告"),
      el("button", { class:"btn", onclick: ()=>refreshAll(), disabled: state.ui.busy }, state.ui.busy ? "..." : "更新")
    ));

    box.appendChild(list);
    return box;
  }

  function viewAdmin(){
    const box = el("div", {});
    box.appendChild(el("div", { class:"title" }, "管理"));

    if(!state.admin.authed){
      const pw = el("input", { type:"password", placeholder:"password" });
      const login = el("button", { class:"btn primary" }, "ログイン");

      login.addEventListener("click", async ()=>{
        setBusy(true);
        try{
          const r = await adminLogin(pw.value);
          state.admin.authed = true;
          state.admin.name = r?.name || "ADMIN";
          state.admin.token = r?.token || "";
          saveAdminSession();
          await refreshAll();
        }catch(e){
          showModal({ title:"error", body: String(e?.message||e), actions:[ el("button", { class:"btn", onclick: closeModal }, "OK") ] });
        }finally{
          setBusy(false);
        }
      });

      box.appendChild(pw);
      box.appendChild(el("div", { class:"actions" }, login));
      box.appendChild(el("div", { class:"muted", style:"margin-top:10px; font-family:var(--mono); font-size:12px;" }, "local: noct-admin"));
      return box;
    }

    box.appendChild(el("div", { class:"actions" },
      el("button", { class:"btn", onclick: ()=>refreshAll(), disabled: state.ui.busy }, state.ui.busy ? "..." : "更新"),
      el("button", { class:"btn danger", onclick: ()=>{
        state.admin = { authed:false, name:"", token:"" };
        saveAdminSession();
        refreshAll();
      } }, "ログアウト")
    ));

    box.appendChild(el("div", { class:"hr" }));

    const tabs = el("div", { class:"actions" });
    const tabState = { v: "pending" };
    const tabBtn = (key, label) => {
      const b = el("button", { class:"btn small" }, label);
      b.addEventListener("click", ()=>{ tabState.v = key; render(); });
      return b;
    };
    tabs.appendChild(tabBtn("pending", `未処理 ${(state.data.pending||[]).length}`));
    tabs.appendChild(tabBtn("approvedAll", `承認 ${(state.data.approvedAll||[]).length}`));
    tabs.appendChild(tabBtn("rejected", `却下 ${(state.data.rejected||[]).length}`));
    box.appendChild(tabs);

    const list = el("div", { class:"list" });
    const items = (
      tabState.v === "pending" ? (state.data.pending||[]) :
      tabState.v === "rejected" ? (state.data.rejected||[]) :
      (state.data.approvedAll||[])
    ).slice();

    if(!items.length){
      list.appendChild(el("div", { class:"notice" }, "なし"));
    }else{
      for(const p of items){
        const node = renderPost(p, { mode:"admin" });
        node.style.cursor = "pointer";
        node.addEventListener("click", ()=>openAdminPost(p));
        list.appendChild(node);
      }
    }

    box.appendChild(list);
    return box;
  }

  function statusBadge(p){
    const cls = p.status === "approved" ? "badge approved" : p.status === "rejected" ? "badge rejected" : "badge pending";
    const label = p.status === "approved" ? "APPROVED" : p.status === "rejected" ? "REJECTED" : "PENDING";
    return el("span", { class: cls }, label);
  }

  function excerpt(text, mode){
    const t = String(text||"");
    const limit = mode === "public" ? 520 : 1600;
    if(t.length <= limit) return t;
    return t.slice(0, limit) + NL + "…";
  }

  function renderPost(p, {mode}){
    const post = el("div", { class:"post" });

    post.appendChild(el("div", { class:"postTop" },
      el("div", {},
        el("div", { class:"postTitle" }, p.title || "(無題)"),
        el("div", { class:"tags" }, ...(p.tags||[]).map(t=>el("span", { class:"tag" }, "#"+t)))
      ),
      el("div", { style:"display:flex; flex-direction:column; gap:8px; align-items:flex-end;" },
        statusBadge(p),
        el("span", { class:"badge" }, (p.visibility === "private" ? "PRIVATE" : "PUBLIC"))
      )
    ));

    post.appendChild(el("div", { class:"postBody" }, excerpt(p.body, mode)));

    post.appendChild(el("div", { class:"postMeta" },
      el("span", {}, `t ${fmtTime(p.createdAt)}`),
      el("span", {}, `s ${String(p.severity||"medium").toUpperCase()}`),
      el("span", {}, `v ${p.votes?.priority||0}/${p.votes?.hold||0}`),
      el("span", {}, `a ${(p.attachments?.length||0)}`)
    ));

    if(mode === "public"){
      const voted = hasVoted(p.id);
      post.appendChild(el("div", { class:"actions" },
        el("button", { class:"btn small primary", disabled: voted || state.ui.busy, onclick: async ()=>{ await doVote(p.id, "priority"); } }, voted ? "投票済" : "優先"),
        el("button", { class:"btn small", disabled: voted || state.ui.busy, onclick: async ()=>{ await doVote(p.id, "hold"); } }, voted ? "投票済" : "保留")
      ));
    }

    if(mode === "mine"){
      if(p.adminNote){
        post.appendChild(el("div", { class:"hr" }));
        post.appendChild(el("div", { class:"notice" }, p.adminNote));
      }
      if(p.attachments?.length){
        post.appendChild(el("div", { class:"hr" }));
        post.appendChild(el("div", { class:"fileList" }, ...p.attachments.map(renderFileChip)));
      }
    }

    return post;
  }

  async function doVote(postId, kind){
    if(hasVoted(postId)) return;
    setBusy(true);
    try{
      const updated = await vote(postId, kind);
      setVoted(postId);
      const a = state.data.approved || [];
      const i = a.findIndex(x=>x.id===postId);
      if(i>=0) a[i] = updated;
      render();
    }catch(e){
      showModal({ title:"error", body: String(e?.message||e), actions:[ el("button", { class:"btn", onclick: closeModal }, "OK") ] });
    }finally{
      setBusy(false);
    }
  }

  function openAdminPost(p){
    const tagEdit = el("input", { type:"text", placeholder:"tags" });
    tagEdit.value = (p.tags||[]).join(", ");

    const note = el("textarea", { placeholder:"note" });
    note.value = p.adminNote || "";

    const body = el("div", {},
      el("div", { class:"muted mono" }, `id ${p.id}`),
      el("div", { class:"muted mono" }, `reporter ${p.reporterId || "-"}`),
      el("div", { class:"hr" }),
      el("div", { class:"postTitle" }, p.title),
      el("div", { class:"postBody", style:"margin-top:10px;" }, p.body || ""),
      el("div", { class:"postMeta" },
        el("span", {}, `created ${fmtTime(p.createdAt)}`),
        el("span", {}, `updated ${fmtTime(p.updatedAt)}`),
        el("span", {}, `vis ${p.visibility}`),
        el("span", {}, `sev ${p.severity}`),
        el("span", {}, `votes ${p.votes?.priority||0}/${p.votes?.hold||0}`)
      ),
      el("div", { class:"hr" }),
      el("div", { class:"muted" }, "tags"),
      tagEdit,
      el("div", { class:"muted", style:"margin-top:12px;" }, "note"),
      note,
      (p.attachments?.length ? el("div", { class:"fileList" }, ...p.attachments.map(renderFileChip)) : el("div", { class:"muted", style:"margin-top:12px;" }, "attachments 0"))
    );

    const approve = el("button", { class:"btn primary" }, "承認");
    const reject  = el("button", { class:"btn danger" }, "却下");
    const close   = el("button", { class:"btn" }, "閉じる");

    close.addEventListener("click", closeModal);
    approve.addEventListener("click", async ()=>{ closeModal(); await doModerate(p, "approve", note.value, tagEdit.value); });
    reject.addEventListener("click", async ()=>{ closeModal(); await doModerate(p, "reject", note.value, tagEdit.value); });

    showModal({ title:"管理", body, actions:[ close, reject, approve ] });
  }

  async function doModerate(p, action, adminNote, tagsCsv){
    setBusy(true);
    try{
      const tags = (tagsCsv||"").split(",").map(s=>s.trim()).filter(Boolean);
      await adminModerate({ postId: p.id, action, adminNote, tags });
      await refreshAll();
    }catch(e){
      showModal({ title:"error", body: String(e?.message||e), actions:[ el("button", { class:"btn", onclick: closeModal }, "OK") ] });
    }finally{
      setBusy(false);
    }
  }

  state.userId = getUserId();
  $("#userIdText").textContent = state.userId;
  loadAdminSession();

  function onHash(){ state.route = getRoute(); render(); }
  window.addEventListener("hashchange", onHash);

  function render(){
    renderNav();
    renderSide();
    renderMain();
    paintConn();
    document.body.style.cursor = state.ui.busy ? "progress" : "default";
  }

  onHash();
  refreshAll();
})();
</script>
</body>
</html>
